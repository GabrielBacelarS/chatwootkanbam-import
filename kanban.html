<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Closefy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-column: #f7f8fa;
            --bg-card: #ffffff;
            --bg-card-hover: #fafbfc;
            --bg-header: #ffffff;
            --bg-input: #ffffff;
            --bg-modal: #ffffff;
            --bg-badge: #eef1f6;
            --bg-info: #f0f4ff;
            --border-primary: #e2e8f0;
            --border-card: #e8ecf1;
            --border-input: #d1d9e6;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --text-muted: #8896ab;
            --text-dim: #a0aec0;
            --accent: #4f6ef7;
            --accent-hover: #3b5de7;
            --accent-light: #eef1ff;
            --accent-text: #4f6ef7;
            --green: #10b981;
            --green-light: #ecfdf5;
            --green-text: #059669;
            --red: #ef4444;
            --red-light: #fef2f2;
            --purple: #8b5cf6;
            --purple-light: #f5f3ff;
            --orange: #f59e0b;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow-card-hover: 0 8px 25px rgba(0,0,0,0.1);
            --radius: 10px;
            --radius-lg: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-column: #1a1d27;
            --bg-card: #222639;
            --bg-card-hover: #2a2e42;
            --bg-header: #161820;
            --bg-input: #222639;
            --bg-modal: #1a1d27;
            --bg-badge: #2a2e42;
            --bg-info: #1e2235;
            --border-primary: #2d3148;
            --border-card: #2d3148;
            --border-input: #3d4260;
            --text-primary: #e8ecf4;
            --text-secondary: #a0aec0;
            --text-muted: #6b7a90;
            --text-dim: #4a5568;
            --accent: #6479f8;
            --accent-hover: #7b8ef9;
            --accent-light: #1e2245;
            --accent-text: #8b9cfa;
            --green-light: #0d2818;
            --green-text: #34d399;
            --red-light: #2d1215;
            --purple-light: #1e1535;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
            --shadow-card: 0 1px 4px rgba(0,0,0,0.2);
            --shadow-card-hover: 0 8px 25px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-primary);
            padding: 0 20px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-logo {
            display: flex; align-items: center; gap: 10px;
            font-size: 16px; font-weight: 800; color: var(--accent);
            letter-spacing: -0.3px;
        }
        .header-logo svg { width: 28px; height: 28px; }
        .header-actions { display: flex; align-items: center; gap: 6px; }
        .header-btn {
            width: 36px; height: 36px; border-radius: 8px; border: none;
            background: transparent; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .header-btn:hover { background: var(--bg-badge); color: var(--accent); }
        .header-btn svg { width: 18px; height: 18px; }

        /* ===== BOARD TABS ===== */
        .tabs-container {
            display: flex; align-items: center; gap: 6px;
            overflow-x: auto; max-width: calc(100vw - 350px);
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab {
            padding: 7px 16px; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 600; white-space: nowrap;
            border: 1px solid transparent; transition: var(--transition);
            background: var(--bg-badge); color: var(--text-secondary);
        }
        .tab:hover { background: var(--accent-light); color: var(--accent-text); }
        .tab.active {
            background: var(--accent); color: white;
            box-shadow: 0 2px 8px rgba(79, 110, 247, 0.3);
        }
        .tab-new {
            padding: 7px 14px; border-radius: 8px; cursor: pointer;
            font-size: 13px; font-weight: 500; white-space: nowrap;
            border: 1.5px dashed var(--border-input); background: transparent;
            color: var(--text-muted); transition: var(--transition);
        }
        .tab-new:hover { border-color: var(--accent); color: var(--accent); }

        /* ===== KANBAN BOARD ===== */
        .kanban-board {
            display: flex; gap: 14px; overflow-x: auto;
            padding: 16px 20px; height: calc(100vh - 56px);
        }
        .kanban-board::-webkit-scrollbar { height: 6px; }
        .kanban-board::-webkit-scrollbar-track { background: transparent; }
        .kanban-board::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

        /* ===== COLUMN ===== */
        .column {
            min-width: 330px; max-width: 330px;
            display: flex; flex-direction: column;
            background: var(--bg-column);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-primary);
            overflow: hidden;
        }
        .column-header {
            padding: 14px 16px; display: flex;
            align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-primary);
            position: relative;
        }
        .column-header::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
        }
        .column-title { display: flex; align-items: center; gap: 8px; }
        .column-title span { font-size: 13px; font-weight: 700; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px; }
        .column-count {
            font-size: 11px; font-weight: 700; padding: 2px 8px;
            border-radius: 10px; background: var(--bg-badge); color: var(--text-muted);
        }
        .column-value {
            font-size: 12px; font-weight: 700; padding: 3px 10px;
            border-radius: 8px; background: var(--green-light); color: var(--green-text);
        }

        /* ===== CARDS AREA ===== */
        .cards-area {
            flex: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .cards-area::-webkit-scrollbar { width: 4px; }
        .cards-area::-webkit-scrollbar-track { background: transparent; }
        .cards-area::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }
        .cards-area.drag-over {
            background: var(--accent-light);
            outline: 2px dashed var(--accent);
            outline-offset: -4px;
            border-radius: var(--radius);
        }

        /* ===== CARD ===== */
        .card {
            background: var(--bg-card); border: 1px solid var(--border-card);
            border-radius: var(--radius); padding: 14px;
            cursor: grab; transition: var(--transition);
            box-shadow: var(--shadow-card); position: relative;
        }
        .card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        .card.dragging { opacity: 0.4; transform: rotate(3deg) scale(0.95); }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
        .card-contact { display: flex; align-items: center; gap: 10px; }
        .card-avatar {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700; color: white;
            flex-shrink: 0;
        }
        .card-name { font-size: 13px; font-weight: 700; color: var(--text-primary); line-height: 1.2; }
        .card-id { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
        .card-value-badge {
            font-size: 11px; font-weight: 700; padding: 3px 8px;
            border-radius: 6px; background: linear-gradient(135deg, #10b981, #059669);
            color: white; white-space: nowrap;
        }
        .card-msg {
            font-size: 12px; color: var(--text-secondary); line-height: 1.5;
            margin-bottom: 10px; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-product {
            font-size: 11px; padding: 4px 8px; border-radius: 6px;
            background: var(--purple-light); color: var(--purple);
            font-weight: 600; margin-bottom: 10px; display: inline-block;
        }
        .card-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 10px; border-top: 1px solid var(--border-primary);
        }
        .card-meta { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--text-muted); }
        .card-assignee {
            font-size: 10px; font-weight: 600; padding: 2px 7px;
            border-radius: 5px; background: var(--bg-badge); color: var(--text-secondary);
        }
        .card-tasks {
            font-size: 11px; font-weight: 600; color: var(--green-text);
            display: flex; align-items: center; gap: 3px;
        }

        /* ===== LOAD MORE ===== */
        .load-more-btn {
            width: 100%; padding: 10px; border: 1.5px dashed var(--border-input);
            border-radius: var(--radius); background: transparent;
            color: var(--text-muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: var(--transition);
            margin-top: 4px;
        }
        .load-more-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

        /* ===== STATES ===== */
        .state-container {
            display: flex; align-items: center; justify-content: center;
            height: calc(100vh - 56px); flex-direction: column; gap: 16px;
        }
        .state-icon { width: 80px; height: 80px; color: var(--text-dim); opacity: 0.5; }
        .state-title { font-size: 20px; font-weight: 700; color: var(--text-secondary); }
        .state-desc { font-size: 14px; color: var(--text-muted); }
        .state-btn {
            margin-top: 8px; padding: 12px 28px; border-radius: var(--radius);
            background: var(--accent); color: white; border: none;
            font-size: 14px; font-weight: 600; cursor: pointer;
            box-shadow: 0 2px 10px rgba(79, 110, 247, 0.3); transition: var(--transition);
        }
        .state-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .spinner {
            width: 40px; height: 40px; border: 3px solid var(--border-primary);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            backdrop-filter: blur(4px); z-index: 100;
            display: flex; align-items: center; justify-content: center;
            animation: fadeIn 0.15s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal {
            background: var(--bg-modal); border-radius: 16px;
            max-width: 720px; width: 95%; max-height: 90vh;
            overflow-y: auto; box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-primary);
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-sm { max-width: 480px; }
        .modal-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border-primary);
            display: flex; align-items: center; justify-content: space-between;
        }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .modal-close {
            width: 32px; height: 32px; border-radius: 8px; border: none;
            background: var(--bg-badge); color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .modal-close:hover { background: var(--red-light); color: var(--red); }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 16px 24px; border-top: 1px solid var(--border-primary);
            display: flex; justify-content: flex-end; gap: 10px;
        }
        .modal-footer-split { justify-content: space-between; }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input {
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-input);
            border-radius: var(--radius); background: var(--bg-input);
            color: var(--text-primary); font-size: 14px; font-family: inherit;
            transition: var(--transition); outline: none;
        }
        .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
        .form-input::placeholder { color: var(--text-dim); }
        textarea.form-input { resize: vertical; min-height: 90px; }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 9px 18px; border-radius: 8px; border: none;
            font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: var(--transition);
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--bg-badge); color: var(--text-secondary); }
        .btn-secondary:hover { background: var(--border-primary); }
        .btn-danger { background: var(--red-light); color: var(--red); }
        .btn-danger:hover { background: var(--red); color: white; }
        .btn-icon { padding: 9px; }

        /* ===== CHECKLIST ===== */
        .label-list { max-height: 260px; overflow-y: auto; border: 1px solid var(--border-primary); border-radius: var(--radius); padding: 6px; }
        .label-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-radius: 8px; cursor: pointer;
            transition: var(--transition);
        }
        .label-item:hover { background: var(--bg-badge); }
        .label-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
        .label-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .label-item span { font-size: 13px; color: var(--text-primary); font-weight: 500; }

        .task-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
        .task-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-dim); }
        .task-text { flex: 1; font-size: 13px; color: var(--text-primary); }
        .task-remove { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; transition: var(--transition); }
        .task-remove:hover { background: var(--red-light); color: var(--red); }

        .info-box { background: var(--bg-info); border-radius: var(--radius); padding: 14px; margin-top: 20px; }
        .info-box h4 { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-row { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .info-row strong { color: var(--text-secondary); }

        /* ===== CARD DETAIL GRID ===== */
        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 640px) { .detail-grid { grid-template-columns: 1fr; } }
        .detail-contact { display: flex; align-items: center; gap: 14px; }
        .detail-avatar {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 800; color: white; flex-shrink: 0;
        }
        .detail-name { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .detail-info { font-size: 13px; color: var(--text-muted); }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle { position: relative; width: 36px; height: 36px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="12" rx="1.5"/></svg>
                Kanban
            </div>
            <div class="tabs-container" id="boardTabs"></div>
            <button id="newBoardBtn" class="tab-new" onclick="showNewBoardModal()" style="display:none">+ Novo Board</button>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="toggleTheme()" title="Alternar tema">
                <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
            </button>
            <button class="header-btn" onclick="refreshBoard()" title="Atualizar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
            <button id="boardSettingsBtn" class="header-btn" onclick="showBoardSettings()" title="Configurar board" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            </button>
            <button id="agentsBtn" class="header-btn" onclick="showAgentsModal()" title="Gerenciar Agentes" style="display:none">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
            </button>
            <button id="userBadge" onclick="changeUser()" class="header-btn" style="display:none;gap:6px;padding:6px 12px;font-size:12px;width:auto" title="Trocar usuário">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span id="userBadgeName"></span>
            </button>
        </div>
    </div>

    <!-- User Selection State (only shown in standalone/dev mode) -->
    <div id="userSelectState" class="state-container" style="display:none">
        <div style="background:var(--orange);color:white;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:16px">
            ⚠️ Modo Desenvolvimento - Acesso via Chatwoot detecta o usuário automaticamente
        </div>
        <svg class="state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <h2 class="state-title">Selecione seu usuário</h2>
        <p class="state-desc">Escolha seu perfil para acessar o kanban (modo teste)</p>
        <div id="userList" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:center;max-width:600px"></div>
    </div>

    <!-- Loading State -->
    <div id="loadingState" class="state-container" style="display:none">
        <div class="spinner"></div>
        <p class="state-desc">Carregando kanban...</p>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="state-container" style="display:none">
        <svg class="state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5" stroke-width="1.5"/><rect x="14" y="3" width="7" height="12" rx="1.5" stroke-width="1.5"/></svg>
        <h2 class="state-title">Crie seu primeiro board</h2>
        <p class="state-desc">Organize suas conversas em colunas com etiquetas</p>
        <button class="state-btn" onclick="showNewBoardModal()">Criar Board</button>
    </div>

    <!-- Kanban Board -->
    <div id="kanbanBoard" class="kanban-board" style="display:none"></div>

    <!-- Modals Container -->
    <div id="modals"></div>

<script>
// ========================================
// CONSTANTS
// ========================================
const PAGE_SIZE = 25;
const INITIAL_LIMIT = 40;
const AVATAR_COLORS = ['#4f6ef7','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#06b6d4'];

// ========================================
// STATE
// ========================================
const state = {
    apiUrl: '', accountId: '', apiToken: '', clientSlug: '',
    boards: [],
    activeBoard: null,
    labels: [],
    conversations: {},   // label -> conversation[]
    columnPages: {},     // label -> current page loaded
    columnHasMore: {},   // label -> boolean
    columnTotal: {},     // label -> total count
    cardData: {},
    draggedCard: null,
    darkMode: false,
    // Permissões de usuário
    currentUser: null,
    allowedBoards: [],
    isAdmin: false
};

// ========================================
// THEME
// ========================================
function detectTheme() {
    const saved = localStorage.getItem('kanban_theme');
    if (saved) return saved === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function applyTheme(dark) {
    state.darkMode = dark;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    localStorage.setItem('kanban_theme', dark ? 'dark' : 'light');
    const icon = document.getElementById('themeIcon');
    if (icon) {
        icon.innerHTML = dark
            ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
            : '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
    }
}

function toggleTheme() {
    applyTheme(!state.darkMode);
}

// ========================================
// INIT
// ========================================
let chatwootUserResolved = false;

async function init() {
    applyTheme(detectTheme());

    if (window.CLIENT_CONFIG) {
        state.apiUrl = window.CLIENT_CONFIG.apiUrl;
        state.accountId = window.CLIENT_CONFIG.accountId;
        state.apiToken = window.CLIENT_CONFIG.apiToken;
        const pathParts = window.location.pathname.split('/').filter(p => p);
        state.clientSlug = pathParts[0] === 'kanban' ? (pathParts[1] || '') : (pathParts[0] || '');
    }

    document.getElementById('loadingState').style.display = 'flex';

    // Listen for Chatwoot context (user info, dark mode)
    window.addEventListener('message', async (e) => {
        let messageData = e.data;

        // Chatwoot pode enviar como string JSON - fazer parse
        if (typeof messageData === 'string') {
            try {
                messageData = JSON.parse(messageData);
            } catch (err) {
                // Não é JSON válido, ignorar
                return;
            }
        }

        console.log('Received message (parsed):', messageData);

        if (messageData && typeof messageData === 'object') {
            // Chatwoot pode enviar em diferentes formatos
            const eventName = messageData.event || messageData.type;
            const eventData = messageData.data || messageData;

            if ((eventName === 'appContext' || eventData.currentAgent || eventData.current_agent) && !chatwootUserResolved) {
                chatwootUserResolved = true;
                console.log('Chatwoot appContext received:', eventData);

                if (eventData.darkMode !== undefined) {
                    applyTheme(eventData.darkMode);
                }

                // Tentar várias propriedades onde o usuário pode estar
                const chatwootUser = eventData.currentAgent
                    || eventData.current_agent
                    || eventData.user
                    || eventData.contact
                    || (eventData.conversation && eventData.conversation.meta && eventData.conversation.meta.assignee);

                console.log('Chatwoot user found:', chatwootUser);

                if (chatwootUser && (chatwootUser.id || chatwootUser.user_id)) {
                    const userId = chatwootUser.id || chatwootUser.user_id;
                    console.log('Authenticating user ID:', userId);
                    await authenticateFromChatwoot({ ...chatwootUser, id: userId });
                    return;
                }

                // Se não veio usuário no appContext, continua fluxo normal
                console.log('No user found in appContext, falling back to checkUserAuth');
                await checkUserAuth();
            }
        }
    });

    // Solicitar contexto do Chatwoot
    try {
        window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
    } catch(e) {}

    // Timeout: se não receber resposta do Chatwoot em 2s, assumir que está rodando standalone
    setTimeout(async () => {
        if (!chatwootUserResolved) {
            chatwootUserResolved = true;
            console.log('Running standalone (not inside Chatwoot)');
            await checkUserAuth();
        }
    }, 2000);
}

async function authenticateFromChatwoot(chatwootUser) {
    try {
        // Buscar permissões do usuário pelo ID do Chatwoot
        console.log('=== authenticateFromChatwoot DEBUG ===');
        console.log('Fetching permissions for user ID:', chatwootUser.id);

        const res = await fetch('/api/' + state.clientSlug + '/user-permissions/' + chatwootUser.id);
        const perm = await res.json();

        console.log('API response:', perm);

        if (perm.found) {
            state.currentUser = {
                id: perm.chatwoot_user_id,
                name: perm.user_name || chatwootUser.name || chatwootUser.available_name
            };
            state.isAdmin = perm.is_admin;
            state.allowedBoards = perm.allowed_boards || [];
            console.log('User authenticated - isAdmin:', state.isAdmin, 'allowedBoards:', state.allowedBoards);
        } else {
            // Usuário não está cadastrado nas permissões - verificar se é admin no Chatwoot
            state.currentUser = {
                id: chatwootUser.id,
                name: chatwootUser.name || chatwootUser.available_name || 'Usuário'
            };
            // Se não tem permissões cadastradas, verificar se é admin no Chatwoot
            state.isAdmin = chatwootUser.role === 'administrator';
            state.allowedBoards = [];
        }

        // Salvar na sessão
        sessionStorage.setItem('kanban_user_' + state.clientSlug, JSON.stringify({
            id: state.currentUser.id,
            name: state.currentUser.name,
            is_admin: state.isAdmin,
            allowed_boards: state.allowedBoards
        }));

        continueInit();
    } catch (e) {
        console.error('Erro ao autenticar via Chatwoot:', e);
        // Fallback: acesso básico (não admin)
        state.currentUser = { id: chatwootUser.id, name: chatwootUser.name || 'Usuário' };
        state.isAdmin = chatwootUser.role === 'administrator';
        state.allowedBoards = [];
        continueInit();
    }
}

async function checkUserAuth() {
    // Verificar se tem usuário salvo na sessão (standalone mode)
    const savedUser = sessionStorage.getItem('kanban_user_' + state.clientSlug);
    if (savedUser) {
        const user = JSON.parse(savedUser);
        state.currentUser = user;
        state.isAdmin = user.is_admin;
        state.allowedBoards = user.allowed_boards || [];
        continueInit();
        return;
    }

    // Modo standalone: mostrar seleção de usuários (apenas para desenvolvimento/teste)
    if (state.clientSlug) {
        try {
            const res = await fetch('/api/' + state.clientSlug + '/users');
            const users = await res.json();
            if (users && users.length > 0) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('userSelectState').style.display = 'flex';
                renderUserList(users);
                return;
            }
        } catch (e) {
            console.warn('Não foi possível carregar usuários:', e.message);
        }
    }

    // Se não tem usuários configurados, continua direto (acesso livre)
    state.isAdmin = true;
    continueInit();
}

function renderUserList(users) {
    const container = document.getElementById('userList');
    container.innerHTML = users.map(u => `
        <button onclick="selectUser(${u.id}, '${u.name.replace(/'/g, "\\'")}', ${u.is_admin}, ${JSON.stringify(u.allowed_boards || []).replace(/"/g, '&quot;')})"
            style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 24px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius);cursor:pointer;transition:var(--transition);min-width:140px"
            onmouseover="this.style.borderColor='var(--accent)';this.style.transform='translateY(-2px)'"
            onmouseout="this.style.borderColor='var(--border-card)';this.style.transform='translateY(0)'">
            <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,${AVATAR_COLORS[u.id % AVATAR_COLORS.length]},${AVATAR_COLORS[(u.id + 3) % AVATAR_COLORS.length]});display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:700">
                ${(u.name || 'U').charAt(0).toUpperCase()}
            </div>
            <span style="font-size:14px;font-weight:600;color:var(--text-primary)">${u.name || 'Sem nome'}</span>
            <span style="font-size:11px;color:var(--text-muted);padding:2px 8px;background:var(--bg-badge);border-radius:4px">
                ${u.role === 'administrator' ? 'Admin' : 'Agente'}
            </span>
        </button>
    `).join('');
}

async function selectUser(userId, userName, isAdmin, allowedBoards) {
    console.log('=== selectUser DEBUG ===');
    console.log('User ID:', userId, 'Name:', userName);
    console.log('Initial isAdmin:', isAdmin, 'allowedBoards:', allowedBoards);

    // Buscar permissões atualizadas
    try {
        const res = await fetch('/api/' + state.clientSlug + '/user-permissions/' + userId);
        const perm = await res.json();
        console.log('API response:', perm);
        if (perm.found) {
            isAdmin = perm.is_admin;
            allowedBoards = perm.allowed_boards || [];
            console.log('Updated from API - isAdmin:', isAdmin, 'allowedBoards:', allowedBoards);
        }
    } catch (e) {
        console.warn('Erro ao buscar permissões:', e.message);
    }

    state.currentUser = { id: userId, name: userName };
    state.isAdmin = isAdmin;
    state.allowedBoards = allowedBoards || [];
    console.log('Final state - isAdmin:', state.isAdmin, 'allowedBoards:', state.allowedBoards);

    // Salvar na sessão
    sessionStorage.setItem('kanban_user_' + state.clientSlug, JSON.stringify({
        id: userId, name: userName, is_admin: isAdmin, allowed_boards: allowedBoards
    }));

    document.getElementById('userSelectState').style.display = 'none';
    continueInit();
}

function changeUser() {
    sessionStorage.removeItem('kanban_user_' + state.clientSlug);
    window.location.reload();
}

function updateUserBadge() {
    const badge = document.getElementById('userBadge');
    const nameSpan = document.getElementById('userBadgeName');
    const agentsBtn = document.getElementById('agentsBtn');
    const newBoardBtn = document.getElementById('newBoardBtn');
    const boardSettingsBtn = document.getElementById('boardSettingsBtn');
    if (state.currentUser && state.currentUser.name) {
        nameSpan.textContent = state.currentUser.name;
        badge.style.display = 'flex';
    }
    // Mostrar botões de admin apenas para admins
    if (state.isAdmin) {
        if (agentsBtn) agentsBtn.style.display = 'flex';
        if (newBoardBtn) newBoardBtn.style.display = 'flex';
        if (boardSettingsBtn) boardSettingsBtn.style.display = 'flex';
    }
}

async function continueInit() {
    console.log('=== continueInit DEBUG ===');
    console.log('state.clientSlug:', state.clientSlug);
    console.log('state.accountId:', state.accountId);
    console.log('state.isAdmin:', state.isAdmin);
    console.log('state.allowedBoards:', state.allowedBoards);

    document.getElementById('loadingState').style.display = 'flex';
    updateUserBadge();

    // Carregar boards do servidor (banco de dados)
    const serverBoards = await loadBoardsFromServer();
    console.log('serverBoards from API:', serverBoards);

    if (serverBoards && serverBoards.length > 0) {
        state.boards = serverBoards;
    } else {
        // Fallback: tentar localStorage (para migração)
        const savedBoards = localStorage.getItem('kanban_boards_' + state.accountId);
        console.log('savedBoards from localStorage (fallback):', savedBoards);
        if (savedBoards) {
            state.boards = JSON.parse(savedBoards);
            // Migrar boards do localStorage para o servidor
            console.log('Migrando boards do localStorage para o servidor...');
            for (const board of state.boards) {
                await saveBoardToServer(board);
            }
        }
    }
    console.log('state.boards after load:', state.boards);

    const savedCards = localStorage.getItem('kanban_cards_' + state.accountId);
    if (savedCards) state.cardData = JSON.parse(savedCards);

    renderBoardTabs();
    const visibleBoards = getVisibleBoards();
    console.log('visibleBoards result:', visibleBoards);

    if (visibleBoards.length > 0) {
        console.log('Selecting first visible board:', visibleBoards[0].id);
        selectBoard(visibleBoards[0].id);
    } else {
        console.log('No visible boards, showing empty state');
        document.getElementById('loadingState').style.display = 'none';
        // Mostrar estado vazio diferente para admin e não-admin
        if (state.isAdmin) {
            document.getElementById('emptyState').style.display = 'flex';
        } else {
            // Para não-admin sem boards permitidos, mostrar mensagem diferente
            document.getElementById('emptyState').innerHTML = `
                <svg class="state-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1.5" stroke-width="1.5"/><rect x="14" y="3" width="7" height="12" rx="1.5" stroke-width="1.5"/></svg>
                <h2 class="state-title">Sem boards disponíveis</h2>
                <p class="state-desc">Você não tem acesso a nenhum board. Solicite ao administrador que libere acesso.</p>
            `;
            document.getElementById('emptyState').style.display = 'flex';
        }
    }
}

// ========================================
// API
// ========================================
async function api(endpoint, method = 'GET', body = null) {
    let url, options;
    if (window.CLIENT_CONFIG && state.clientSlug) {
        url = '/api/' + state.clientSlug + endpoint;
        options = { method, headers: { 'Content-Type': 'application/json' } };
    } else {
        url = state.apiUrl + '/api/v1/accounts/' + state.accountId + endpoint;
        options = { method, headers: { 'api_access_token': state.apiToken, 'Content-Type': 'application/json' } };
    }
    if (body) options.body = JSON.stringify(body);
    const res = await fetch(url, options);
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
}

async function fetchLabels() {
    const data = await api('/labels');
    const labels = data.payload || data || [];
    state.labels = labels;
    return state.labels;
}

async function fetchConversationsPage(label, page) {
    // Try filter API first
    try {
        const data = await api('/conversations/filter', 'POST', {
            payload: [
                { attribute_key: 'labels', filter_operator: 'equal_to', values: [label], query_operator: null }
            ],
            page: page
        });
        const convs = data.data?.payload || data.payload || [];
        const total = data.data?.meta?.all_count || data.meta?.all_count || convs.length;
        return { convs, total };
    } catch (e) {
        console.warn('Filter API falhou, tentando fallback...', e.message);
    }

    // Fallback: list with label filter
    try {
        const data = await api('/conversations?labels[]=' + encodeURIComponent(label) + '&page=' + page);
        const convs = data.data?.payload || data.payload || [];
        const total = data.data?.meta?.all_count || data.meta?.all_count || convs.length;
        return { convs, total };
    } catch (e2) {
        console.warn('List API falhou, tentando busca total...', e2.message);
    }

    // Fallback: all conversations filtered client-side
    try {
        const data = await api('/conversations?page=' + page);
        const allConvs = data.data?.payload || data.payload || [];
        const convs = allConvs.filter(c => c.labels && c.labels.includes(label));
        return { convs, total: convs.length };
    } catch (e3) {
        return { convs: [], total: 0 };
    }
}

async function getConversationLabels(convId) {
    try {
        const data = await api('/conversations/' + convId + '/labels');
        return data.payload || data || [];
    } catch(e) { return []; }
}

async function setConversationLabels(convId, labels) {
    return api('/conversations/' + convId + '/labels', 'POST', { labels });
}

// ========================================
// BOARDS
// ========================================
async function saveBoards() {
    // Também mantém no localStorage como cache local
    localStorage.setItem('kanban_boards_' + state.accountId, JSON.stringify(state.boards));
}

async function saveBoardToServer(board) {
    try {
        await fetch('/api/' + state.clientSlug + '/boards', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(board)
        });
    } catch (e) {
        console.error('Erro ao salvar board no servidor:', e);
    }
}

async function updateBoardOnServer(boardId, data) {
    try {
        await fetch('/api/' + state.clientSlug + '/boards/' + boardId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
    } catch (e) {
        console.error('Erro ao atualizar board no servidor:', e);
    }
}

async function deleteBoardFromServer(boardId) {
    try {
        await fetch('/api/' + state.clientSlug + '/boards/' + boardId, {
            method: 'DELETE'
        });
    } catch (e) {
        console.error('Erro ao deletar board do servidor:', e);
    }
}

async function loadBoardsFromServer() {
    try {
        const res = await fetch('/api/' + state.clientSlug + '/boards');
        const boards = await res.json();
        return boards || [];
    } catch (e) {
        console.error('Erro ao carregar boards do servidor:', e);
        return [];
    }
}

function saveCardData() {
    localStorage.setItem('kanban_cards_' + state.accountId, JSON.stringify(state.cardData));
}

function getCardData(convId) {
    return state.cardData[convId] || { product: '', value: '', notes: '', tasks: [] };
}

function setCardData(convId, data) {
    state.cardData[convId] = { ...getCardData(convId), ...data };
    saveCardData();
}

function getVisibleBoards() {
    console.log('=== getVisibleBoards DEBUG ===');
    console.log('state.isAdmin:', state.isAdmin);
    console.log('state.boards:', state.boards);
    console.log('state.allowedBoards:', state.allowedBoards);

    // Admin vê todos os boards
    if (state.isAdmin) {
        console.log('User is admin, returning all boards');
        return state.boards;
    }
    // Não-admin vê apenas os boards permitidos
    const allowed = state.allowedBoards || [];
    console.log('Allowed board IDs:', allowed);

    const visibleBoards = state.boards.filter(b => {
        const isAllowed = allowed.includes(b.id);
        console.log(`Board "${b.name}" (${b.id}): allowed = ${isAllowed}`);
        return isAllowed;
    });

    console.log('Visible boards:', visibleBoards);
    return visibleBoards;
}

function renderBoardTabs() {
    const container = document.getElementById('boardTabs');
    const visibleBoards = getVisibleBoards();
    container.innerHTML = visibleBoards.map(b =>
        '<button class="tab ' + (state.activeBoard?.id === b.id ? 'active' : '') + '" onclick="selectBoard(\'' + b.id + '\')">' +
        escapeHtml(b.name) + '</button>'
    ).join('');
}

async function selectBoard(boardId) {
    state.activeBoard = state.boards.find(b => b.id === boardId);
    if (!state.activeBoard) return;

    renderBoardTabs();
    document.getElementById('loadingState').style.display = 'flex';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('kanbanBoard').style.display = 'none';

    if (state.labels.length === 0) {
        try { await fetchLabels(); } catch(e) {}
    }

    // Load first batch for each column (up to INITIAL_LIMIT)
    state.conversations = {};
    state.columnPages = {};
    state.columnHasMore = {};
    state.columnTotal = {};

    const promises = state.activeBoard.columns.map(async col => {
        let allConvs = [];
        let page = 1;
        while (allConvs.length < INITIAL_LIMIT) {
            const { convs, total } = await fetchConversationsPage(col.label, page);
            state.columnTotal[col.label] = total;
            if (convs.length === 0) break;
            allConvs = allConvs.concat(convs);
            if (allConvs.length >= total || convs.length < PAGE_SIZE) break;
            page++;
        }
        state.conversations[col.label] = allConvs;
        state.columnPages[col.label] = page;
        state.columnHasMore[col.label] = allConvs.length < (state.columnTotal[col.label] || 0);
    });

    await Promise.all(promises);

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('kanbanBoard').style.display = 'flex';
    renderBoard();
}

async function refreshBoard() {
    if (state.activeBoard) await selectBoard(state.activeBoard.id);
}

async function loadMore(label) {
    const btn = document.querySelector('[data-loadmore="' + label + '"]');
    if (btn) { btn.textContent = 'Carregando...'; btn.disabled = true; }

    const nextPage = (state.columnPages[label] || 1) + 1;
    const { convs, total } = await fetchConversationsPage(label, nextPage);

    state.columnTotal[label] = total;
    if (convs.length > 0) {
        state.conversations[label] = (state.conversations[label] || []).concat(convs);
        state.columnPages[label] = nextPage;
    }
    state.columnHasMore[label] = state.conversations[label].length < total && convs.length >= PAGE_SIZE;

    renderBoard();
}

// ========================================
// RENDER
// ========================================
function getAvatarColor(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function renderBoard() {
    const board = document.getElementById('kanbanBoard');
    if (!state.activeBoard) return;

    board.innerHTML = state.activeBoard.columns.map(col => {
        const convs = state.conversations[col.label] || [];
        const total = state.columnTotal[col.label] || convs.length;
        const hasMore = state.columnHasMore[col.label];
        const totalValue = convs.reduce((sum, c) => sum + (parseFloat(getCardData(c.id).value) || 0), 0);

        return `
        <div class="column">
            <div class="column-header" style="--col-color: ${col.color || '#6366f1'}">
                <style>.column-header::before { background: ${col.color || '#6366f1'}; }</style>
                <div class="column-title">
                    <span>${escapeHtml(col.name)}</span>
                    <span class="column-count">${total}</span>
                </div>
                ${totalValue > 0 ? '<span class="column-value">R$ ' + totalValue.toLocaleString('pt-BR', {minimumFractionDigits: 2}) + '</span>' : ''}
            </div>
            <div class="cards-area" data-label="${col.label}"
                ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, '${col.label}')">
                ${convs.map(conv => renderCard(conv, col.label)).join('')}
                ${hasMore ? '<button class="load-more-btn" data-loadmore="' + col.label + '" onclick="event.stopPropagation();loadMore(\'' + col.label + '\')">Carregar mais (' + (total - convs.length) + ' restantes)</button>' : ''}
            </div>
        </div>`;
    }).join('');

    // Fix: each column needs its own color for the ::before pseudo-element
    document.querySelectorAll('.column-header').forEach(el => {
        const style = el.querySelector('style');
        if (style) style.remove();
        const color = el.style.getPropertyValue('--col-color');
        el.style.setProperty('--col-color', color);
    });
    // Apply per-column top border color via inline
    document.querySelectorAll('.column-header').forEach(el => {
        const color = el.style.getPropertyValue('--col-color');
        if (color) {
            const before = document.createElement('div');
            before.style.cssText = `position:absolute;top:0;left:0;right:0;height:3px;background:${color};border-radius:14px 14px 0 0;`;
            el.style.position = 'relative';
            // Remove old bars
            el.querySelectorAll('[data-colbar]').forEach(b => b.remove());
            before.setAttribute('data-colbar', '1');
            el.prepend(before);
        }
    });
}

function renderCard(conv, columnLabel) {
    const contact = conv.meta?.sender || {};
    const assignee = conv.meta?.assignee;
    const cd = getCardData(conv.id);
    const hasValue = cd.value && parseFloat(cd.value) > 0;
    const hasTasks = cd.tasks && cd.tasks.length > 0;
    const doneTasks = hasTasks ? cd.tasks.filter(t => t.done).length : 0;
    const lastMsg = conv.last_non_activity_message?.content || conv.messages?.[0]?.content || '';
    const name = contact.name || 'Sem nome';
    const color = getAvatarColor(name);

    return `
    <div class="card" draggable="true" data-conv-id="${conv.id}" data-label="${columnLabel}"
        ondragstart="handleDragStart(event, ${conv.id}, '${columnLabel}')" ondragend="handleDragEnd(event)"
        onclick="openCardDetail(${conv.id}, '${columnLabel}')">
        <div class="card-top">
            <div class="card-contact">
                <div class="card-avatar" style="background:${color}">${name[0].toUpperCase()}</div>
                <div>
                    <div class="card-name">${escapeHtml(name)}</div>
                    <div class="card-id">#${conv.id}${contact.phone_number ? ' &middot; ' + escapeHtml(contact.phone_number) : ''}</div>
                </div>
            </div>
            ${hasValue ? '<span class="card-value-badge">R$ ' + parseFloat(cd.value).toLocaleString('pt-BR') + '</span>' : ''}
        </div>
        ${lastMsg ? '<div class="card-msg">' + escapeHtml(lastMsg.substring(0, 120)) + '</div>' : ''}
        ${cd.product ? '<div class="card-product">' + escapeHtml(cd.product) + '</div>' : ''}
        <div class="card-footer">
            <div class="card-meta">
                ${hasTasks ? '<span class="card-tasks"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg> ' + doneTasks + '/' + cd.tasks.length + '</span>' : ''}
                ${cd.notes ? '<span title="Tem anotacoes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>' : ''}
            </div>
            ${assignee ? '<span class="card-assignee">' + escapeHtml((assignee.name || '').split(' ')[0]) + '</span>' : ''}
        </div>
    </div>`;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

// ========================================
// DRAG & DROP
// ========================================
function handleDragStart(e, convId, fromLabel) {
    state.draggedCard = { convId, fromLabel };
    e.target.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
    e.target.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function handleDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function handleDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

async function handleDrop(e, toLabel) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');

    if (!state.draggedCard) return;
    const { convId, fromLabel } = state.draggedCard;
    if (fromLabel === toLabel) return;

    const conv = state.conversations[fromLabel]?.find(c => c.id === convId);
    if (!conv) return;

    // Optimistic update
    state.conversations[fromLabel] = state.conversations[fromLabel].filter(c => c.id !== convId);
    if (!state.conversations[toLabel]) state.conversations[toLabel] = [];
    state.conversations[toLabel].unshift(conv);
    renderBoard();

    try {
        const currentLabels = await getConversationLabels(convId);
        const newLabels = currentLabels.filter(l => l !== fromLabel);
        if (!newLabels.includes(toLabel)) newLabels.push(toLabel);
        await setConversationLabels(convId, newLabels);
    } catch (err) {
        state.conversations[toLabel] = state.conversations[toLabel].filter(c => c.id !== convId);
        state.conversations[fromLabel].unshift(conv);
        renderBoard();
        alert('Erro ao mover: ' + err.message);
    }

    state.draggedCard = null;
}

function closeModal() {
    document.getElementById('modals').innerHTML = '';
}

function saveCard(convId, columnLabel) {
    setCardData(convId, {
        product: document.getElementById('cardProduct').value,
        value: document.getElementById('cardValue').value,
        notes: document.getElementById('cardNotes').value
    });
    closeModal();
    renderBoard();
}

function addTask(convId, columnLabel) {
    const input = document.getElementById('newTaskInput');
    if (!input.value.trim()) return;
    const cd = getCardData(convId);
    const tasks = cd.tasks || [];
    tasks.push({ text: input.value.trim(), done: false });
    setCardData(convId, { tasks });
    openCardDetail(convId, columnLabel);
}

function toggleTask(convId, index, columnLabel) {
    const cd = getCardData(convId);
    if (cd.tasks && cd.tasks[index]) {
        cd.tasks[index].done = !cd.tasks[index].done;
        setCardData(convId, { tasks: cd.tasks });
        openCardDetail(convId, columnLabel);
    }
}

function removeTask(convId, index, columnLabel) {
    const cd = getCardData(convId);
    if (cd.tasks) {
        cd.tasks.splice(index, 1);
        setCardData(convId, { tasks: cd.tasks });
        openCardDetail(convId, columnLabel);
    }
}

async function createBoard() {
    if (!state.isAdmin) {
        alert('Apenas administradores podem criar boards');
        return;
    }
    const name = document.getElementById('newBoardName').value.trim();
    if (!name) return alert('Digite um nome para o board');

    const checkboxes = document.querySelectorAll('.board-label-cb:checked');
    if (checkboxes.length === 0) return alert('Selecione pelo menos uma etiqueta');

    const columns = Array.from(checkboxes).map(cb => ({
        label: cb.value,
        name: cb.value.charAt(0).toUpperCase() + cb.value.slice(1).replace(/_/g, ' '),
        color: cb.dataset.color || '#6366f1'
    }));

    const board = {
        id: 'board_' + Date.now(),
        name,
        columns,
        createdAt: new Date().toISOString()
    };

    // Salvar no servidor primeiro
    await saveBoardToServer(board);

    state.boards.push(board);
    saveBoards(); // Cache local
    closeModal();
    renderBoardTabs();
    selectBoard(board.id);
}

async function updateBoard(boardId) {
    if (!state.isAdmin) {
        alert('Apenas administradores podem editar boards');
        return;
    }
    const board = state.boards.find(b => b.id === boardId);
    if (!board) return;

    board.name = document.getElementById('editBoardName').value.trim() || board.name;
    const checkboxes = document.querySelectorAll('.board-label-cb:checked');
    board.columns = Array.from(checkboxes).map(cb => ({
        label: cb.value,
        name: cb.value.charAt(0).toUpperCase() + cb.value.slice(1).replace(/_/g, ' '),
        color: cb.dataset.color || '#6366f1'
    }));

    // Atualizar no servidor
    await updateBoardOnServer(boardId, { name: board.name, columns: board.columns });

    saveBoards(); // Cache local
    closeModal();
    selectBoard(boardId);
}

async function deleteBoard(boardId) {
    if (!state.isAdmin) {
        alert('Apenas administradores podem excluir boards');
        return;
    }
    if (!confirm('Tem certeza que deseja excluir este board?')) return;

    // Deletar do servidor
    await deleteBoardFromServer(boardId);

    state.boards = state.boards.filter(b => b.id !== boardId);
    saveBoards(); // Cache local
    closeModal();
    state.activeBoard = null;
    renderBoardTabs();
    if (state.boards.length > 0) {
        selectBoard(state.boards[0].id);
    } else {
        document.getElementById('kanbanBoard').style.display = 'none';
        document.getElementById('emptyState').style.display = 'flex';
    }
}

            </div>
            <div class="modal-footer" style="justify-content:space-between">
                <button class="btn btn-secondary" onclick="syncAgentsFromChatwoot()" style="display:flex;align-items:center;gap:6px">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    Sincronizar do Chatwoot
                </button>
                <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
            </div>
        </div>
    </div>`;
}

async function syncAgentsFromChatwoot() {
    const btn = event.target;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Sincronizando...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/' + state.clientSlug + '/sync-users', { method: 'POST' });
        const data = await res.json();

        if (data.success) {
            // Recarregar agentes
            const usersRes = await fetch('/api/' + state.clientSlug + '/users');
            agentsState.agents = await usersRes.json();
            renderAgentsModal();
            alert('Sincronizado! ' + (data.synced || 0) + ' usuários importados.');
        } else {
            throw new Error(data.error || 'Erro ao sincronizar');
        }
    } catch (e) {
        alert('Erro: ' + e.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}

async function toggleAgentAdmin(agentId, isAdmin) {
    const agent = agentsState.agents.find(a => a.id === agentId);
    if (!agent) return;

    try {
        await fetch('/api/' + state.clientSlug + '/user-permissions/' + agent.chatwoot_user_id, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                is_admin: isAdmin,
                allowed_boards: agent.allowed_boards || []
            })
        });

        agent.is_admin = isAdmin;
        renderAgentsModal();
    } catch (e) {
        alert('Erro ao salvar: ' + e.message);
        renderAgentsModal();
    }
}

async function toggleAgentBoard(agentId, boardId, isChecked) {
    const agent = agentsState.agents.find(a => a.id === agentId);
    if (!agent) return;

    let allowedBoards = agent.allowed_boards || [];

    if (isChecked) {
        if (!allowedBoards.includes(boardId)) {
            allowedBoards.push(boardId);
        }
    } else {
        allowedBoards = allowedBoards.filter(b => b !== boardId);
    }

    try {
        await fetch('/api/' + state.clientSlug + '/user-permissions/' + agent.chatwoot_user_id, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                is_admin: agent.is_admin || false,
                allowed_boards: allowedBoards
            })
        });

        agent.allowed_boards = allowedBoards;
        renderAgentsModal();
    } catch (e) {
        alert('Erro ao salvar: ' + e.message);
        renderAgentsModal();
    }
}
