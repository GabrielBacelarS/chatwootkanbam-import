version: "3.8"

# Stack Closefy para Portainer com Traefik
# Frontend (nginx) exposto via Traefik | Backend interno
# Usa Redis, PostgreSQL (pgvector2) e MinIO externos da rede Admin
#
# IMPORTANTE: Criar o banco antes do deploy:
#   docker exec -it $(docker ps -q -f name=pgvector2) psql -U postgres -c "CREATE DATABASE iaclosefysaas;"

services:
  # Frontend (nginx) - exposto via Traefik
  closefy_frontend:
    image: gabrielbacelars/closefy-frontend:latest
    networks:
      - Admin
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=Admin"
        - "traefik.http.routers.closefy.rule=Host(`iastg.closefy.ai`)"
        - "traefik.http.routers.closefy.entrypoints=websecure"
        - "traefik.http.routers.closefy.tls=true"
        - "traefik.http.routers.closefy.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.closefy.loadbalancer.server.port=80"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend (FastAPI) - interno, acessado pelo nginx
  closefy_backend:
    image: gabrielbacelars/closefy-backend:latest
    environment:
      - PORT=3000
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:84042ef786ca2d2fa2933a3ac3fd8314@pgvector2:5432/iaclosefysaas
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=6d9015aaeb3388cc2ca6981eccea4b5a747f18d52dd669b5625f7afbdb049ea1
      - ADMIN_EMAIL=admin@closefy.ai
      - ADMIN_PASSWORD=RCVFgFmH27ECEoJK
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=storage.closefy.ai
      - MINIO_ACCESS_KEY=STG
      - MINIO_SECRET_KEY=Dda0621Dda0621@
      - MINIO_SECURE=false
      - TZ=America/Sao_Paulo
    networks:
      - Admin
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  Admin:
    external: true
    name: Admin
