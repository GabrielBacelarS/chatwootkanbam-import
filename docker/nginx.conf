server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS do Docker (resolve em runtime, nao na inicializacao)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy API para o backend interno
    location /api/ {
        set $backend closefy_backend;
        proxy_pass http://$backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy Webhook para o backend interno
    location /webhook/ {
        set $backend closefy_backend;
        proxy_pass http://$backend:3000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check do backend (proxy)
    location = /health {
        set $backend closefy_backend;
        proxy_pass http://$backend:3000/health;
    }

    # Docs do backend (proxy)
    location = /docs {
        set $backend closefy_backend;
        proxy_pass http://$backend:3000/docs;
    }

    location = /openapi.json {
        set $backend closefy_backend;
        proxy_pass http://$backend:3000/openapi.json;
    }

    # Assets estaticos com cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA catch-all: qualquer rota serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
