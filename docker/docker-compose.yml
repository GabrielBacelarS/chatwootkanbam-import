version: "3.8"

# IMPORTANTE: Crie um arquivo .env na pasta docker/ com as credenciais
# Use docker/.env.example como base

services:
  closefy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-closefy}:${POSTGRES_PASSWORD}@closefy_db:5432/${POSTGRES_DB:-closefydb}
      - REDIS_URL=redis://closefy_redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MINIO_ENDPOINT=closefy_minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-closefy}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_SECURE=false
      - TZ=America/Sao_Paulo
    depends_on:
      closefy_db:
        condition: service_healthy
      closefy_redis:
        condition: service_healthy
      closefy_minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  closefy_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-closefy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-closefydb}
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - closefy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-closefy}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Redis para cache e sessoes
  closefy_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - closefy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # MinIO para armazenamento de arquivos (produtos, midias)
  closefy_minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-closefy}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - closefy_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  closefy_pgdata:
    driver: local
  closefy_redis_data:
    driver: local
  closefy_minio_data:
    driver: local
