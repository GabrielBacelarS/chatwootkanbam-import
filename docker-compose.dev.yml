services:
  closefy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://closefy:Closefy2026!!@closefy_db:5432/closefydb?sslmode=disable
      - SESSION_SECRET=closefy-dev-secret-key-2026
      - ADMIN_EMAIL=gbacelar099@gmail.com
      - ADMIN_PASSWORD=gABRIEL1!
      - TZ=America/Sao_Paulo
    depends_on:
      closefy_db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  closefy_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=closefy
      - POSTGRES_PASSWORD=Closefy2026!!
      - POSTGRES_DB=closefydb
      - TZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - closefy_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closefy"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  closefy_pgdata_dev:
    driver: local
