version: "3.7"

services:
  closefy:
    image: gabrielbacelars/closefy-kanban-importer:v8
    networks:
      - traefik_public
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://closefy:Closefy2026!!@closefy_db:5432/closefydb?sslmode=disable
      - SESSION_SECRET=closefy-super-secret-key-2026-prod
      - ADMIN_EMAIL=gbacelar099@gmail.com
      - ADMIN_PASSWORD=gABRIEL1!
      - TZ=America/Sao_Paulo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      labels:
        - traefik.enable=true
        - traefik.http.routers.closefy.rule=Host(`disparador.agilesaas.com.br`)
        - traefik.http.routers.closefy.entrypoints=websecure
        - traefik.http.routers.closefy.tls.certresolver=letsencryptresolver
        - traefik.http.services.closefy.loadbalancer.server.port=3000
        - traefik.http.services.closefy.loadbalancer.passHostHeader=true

  closefy_db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=closefy
      - POSTGRES_PASSWORD=Closefy2026!!
      - POSTGRES_DB=closefydb
      - TZ=America/Sao_Paulo
    networks:
      - traefik_public
    volumes:
      - closefy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closefy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  closefy_pgdata:
    driver: local

networks:
  traefik_public:
    external: true
    name: traefik_public
